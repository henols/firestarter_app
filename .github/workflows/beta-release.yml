name: Create a new beta pre-release
on:
  push:
    branches:
    - beta
    paths-ignore:
    - '**.md'
    - '**.sh'
    - '.gitignore'
    - 'docs/**'
    - 'images/**'
    - '.github/**'
    - '.vscode/**'
    - 'tools/**'
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Explicit PEP 440 pre-release version (e.g. 3.1.0b1). Leave blank for auto-increment via git-tag scan.'
        required: false
        type: string

jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test deps
        run: pip install -e .[test]

      - name: Catalog validity check
        run: python3 tools/catalog/codegen.py --catalog tools/catalog/messages.toml --check

      - name: Codegen drift gate (messages.py)
        # messages.py is generated from the catalog, then ruff-normalized like
        # all repo source (ruff format + the Phase 37 TOOL-01 --add-noqa
        # baseline). Apply the SAME normalization to the regenerated output
        # before diffing, otherwise the raw codegen text reports false drift
        # against the committed, ruff-normalized file.
        run: |
          python3 tools/catalog/codegen.py \
            --catalog tools/catalog/messages.toml \
            --target firestarter/messages.py \
            --language python
          python3 -m ruff format firestarter/messages.py
          python3 -m ruff check --add-noqa firestarter/messages.py
          git diff --exit-code firestarter/messages.py

      - name: Run pytest
        run: pytest tests/ -v

      - name: Create new pre-release version
        id: version
        env:
          BETA_VERSION: ${{ github.event.inputs.beta_version }}
        run: .github/scripts/update_version.py

      - name: Commit updated version
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5

      # Resolve the post-auto-commit HEAD SHA. When git-auto-commit-action
      # creates a commit it sets steps.auto_commit.outputs.commit_hash; if no
      # changes were staged (idempotent re-run) we fall back to the current
      # HEAD. This SHA is then passed as target_commitish to action-gh-release
      # so the tag lands on the commit that contains the bumped __version__,
      # NOT on the workflow's pre-bump trigger SHA. (Phase 20 E2E-02 fix.)
      - name: Resolve release target SHA
        id: release_target
        run: |
          SHA="${{ steps.auto_commit.outputs.commit_hash }}"
          if [ -z "$SHA" ]; then
            SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release target SHA: $SHA"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.release_target.outputs.sha }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
