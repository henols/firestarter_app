name: Publish to PyPI.org
# Manual recovery when the PyPI job in release.yml cannot be rerun. In "Use
# workflow from", select a release tag that contains this workflow.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the dispatched release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+((b|rc)[0-9]+)?$ ]]; then
            echo "::error::Select a release tag (X.Y.Z, X.Y.ZbN or X.Y.ZrcN)."
            exit 1
          fi
          # Use the real annotated tags for setuptools-scm, as in release.yml.
          git fetch --force --tags origin
          if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::The release tag no longer points at the dispatched commit."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: python3 -m pip install --upgrade build && python3 -m build

      - name: Check that the build carries the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "dist/firestarter-$TAG.tar.gz"
          test -f "dist/firestarter-$TAG-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  # Keep the trusted publisher identity unchanged. Only this job can mint an
  # OIDC token; it never checks out source or executes the package build.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/firestarter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
