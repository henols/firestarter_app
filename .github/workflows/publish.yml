name: Publish to PyPI.org
# Manual escape hatch only: re-publish an existing release tag to PyPI, for
# example when the pypi job of release.yml failed and a re-run cannot fix it.
# The normal path is release.yml, which publishes on a tag push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to PyPI (e.g. 3.2.0b1, 3.2.0).'
        required: true
        type: string
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so setuptools-scm can read the tag.
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - run: python3 -m pip install --upgrade build && python3 -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
