name: Release
# A release happens ONLY when a version tag is pushed. A push to a branch never
# publishes.
#
#   3.2.0b1, 3.2.0rc1  -> GitHub pre-release + PyPI pre-release
#   3.2.0              -> GitHub release marked Latest + PyPI release
#
# The tag IS the version: setuptools-scm reads it at build time, so no file in
# the repository holds the version and no bot commits a bump. To release:
#
#   git tag 3.2.0b1 <commit-on-main> && git push origin 3.2.0b1
#
# or run tools/release.sh, which adds some checks first.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Never cancel a release half way. The group name must differ from ci.yml's
# `${{ github.workflow }}-${{ github.ref }}`: ci.yml runs inside this workflow,
# and a called workflow that shares its caller's group deadlocks.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+((b|rc)[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is not X.Y.Z, X.Y.ZbN or X.Y.ZrcN"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$TAG' points at a commit that is not on main"
            exit 1
          fi
          PRERELEASE=false
          if [[ "$TAG" =~ (b|rc)[0-9]+$ ]]; then
            PRERELEASE=true
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (pre-release: $PRERELEASE)" | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the sdist and the wheel
        run: python3 -m pip install --upgrade build && python3 -m build

      - name: Check that the build carries the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls dist/
          test -f "dist/firestarter-$TAG.tar.gz"
          test -f "dist/firestarter-$TAG-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.check.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true

  # Uploads the same files that the GitHub release carries.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run of a failed job must not fail on files already uploaded.
          skip-existing: true
